<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Curriculum Vitae – Kris-Mikael Krister" />
    <title>Curriculum Vitae | Kris-Mikael Krister</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Raleway:ital,wght@0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <main id="top" class="page">
      <section class="cv-card" aria-labelledby="applicant-name">
        <header class="cv-header">
          <div class="cv-header-top">
            <span class="eyebrow" id="cv-eyebrow">Curriculum Vitae</span>
            <div
              class="lang-toggle"
              role="group"
              aria-label="Language selection / Språkvalg"
            >
              <button
                type="button"
                class="lang-btn active"
                data-lang="en"
                aria-pressed="true"
              >
                English
              </button>
              <button
                type="button"
                class="lang-btn"
                data-lang="no"
                aria-pressed="false"
              >
                Norsk
              </button>
            </div>
          </div>

          <div class="intro-layout">
            <div class="intro-content">
              <h1 id="applicant-name" class="cv-name">Kris-Mikael Krister</h1>
              <p id="cv-role" class="cv-role"></p>
            </div>
            <div class="intro-avatar-wrapper">
              <img
                id="profile-photo"
                src="242216.jpeg"
                alt="Portrait photo of Kris-Mikael Krister"
                class="cv-avatar"
              />
            </div>
          </div>
        </header>

        <div class="cv-container">
          <!-- Contact List -->
          <ul
            id="kontakt"
            class="contact-list"
            aria-label="Contact information"
          ></ul>

          <!-- Dynamic CV Sections rendered via script.js -->
          <div id="cv-content"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span id="last-updated"></span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
